[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github_conn"
version = "0.3.1"
authors = [
  { name="Alessandro", email="gargoalexdc@gmail.com" },
]
description = "Lightweight Python client for GitHub API with robust error handling, authentication, and pagination support"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["github", "api", "client", "github-api", "api-wrapper", "python", "rest-api", "github-client", "authentication", "pagination"]
dependencies = [
    "requests>=2.28.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Version Control :: Git",
    "Development Status :: 4 - Beta",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Dal-Canto/github_conn"
Repository = "https://github.com/Dal-Canto/github_conn.git"
Issues = "https://github.com/Dal-Canto/github_conn/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src/github_conn --cov-report=term-missing --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["src/github_conn"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
